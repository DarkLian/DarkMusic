plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

repositories {
    mavenCentral()
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "darkmusic" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Libraries nested in the mod JAR. Their sources go into the third-party source archive, so upgrade them here only.
// The soundlibs entries are declared without their transitive dependencies; the list names the ones needed.
def bundledLibraries = [
        'net.jthink:jaudiotagger:3.0.1'                 : true,
        'com.googlecode.soundlibs:mp3spi:1.9.5.4'       : false,
        'com.googlecode.soundlibs:vorbisspi:1.0.3.3'    : false,
        'com.googlecode.soundlibs:jlayer:1.0.1.4'       : false,
        'com.googlecode.soundlibs:tritonus-share:0.3.7.4': false,
        'org.jflac:jflac-codec:1.5.2'                   : true,
]

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    ['fabric-api-base', 'fabric-lifecycle-events-v1', 'fabric-key-mapping-api-v1',
     'fabric-screen-api-v1', 'fabric-rendering-v1', 'fabric-resource-loader-v1', 'fabric-command-api-v2'].each {
        implementation fabricApi.module(it, project.fabric_api_version)
    }
    bundledLibraries.each { coordinates, transitive ->
        if (transitive) implementation include(coordinates)
        else {
            implementation(coordinates) { it.transitive = false }
            include(coordinates) { it.transitive = false }
        }
    }
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm:9.11.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations { thirdPartySources }
dependencies {
    bundledLibraries.keySet().each {
        thirdPartySources("$it:sources") { transitive = false }
    }
}
tasks.register('thirdPartySourceBundle', Zip) {
    archiveBaseName = 'darkmusic'
    archiveVersion = project.version
    archiveClassifier = 'third-party-sources'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(configurations.thirdPartySources)
    from('src/main/resources/licenses') { into 'licenses' }
    from('src/main/resources/THIRD-PARTY-NOTICES.md')
}
assemble.dependsOn tasks.named('thirdPartySourceBundle')

// Shared with gradle/smoke.gradle.
def realMusicDirectory = ext.realMusicDirectory = file(providers.gradleProperty('musicDirectory').orElse(providers.environmentVariable('DARKMUSIC_TEST_MUSIC')).getOrElse('run/config/darkmusic/music')).absolutePath
def downloadToolsDirectory = ext.downloadToolsDirectory = file(providers.gradleProperty('downloadToolsDirectory').getOrElse('Music'))

if (providers.gradleProperty('smoke').isPresent()) apply from: 'gradle/smoke.gradle'

sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
test {
    dependsOn tasks.named('jar')
    useJUnitPlatform()
    maxHeapSize = '512m'
    systemProperty 'java.awt.headless', !providers.gradleProperty('desktopIntegration').isPresent()
    systemProperty 'darkmusic.test.lyricsNetwork', providers.gradleProperty('lyricsIntegration').isPresent()
    systemProperty 'darkmusic.test.desktop', providers.gradleProperty('desktopIntegration').isPresent()
    systemProperty 'darkmusic.test.pipNetwork', providers.gradleProperty('pipRuntimeIntegration').isPresent()
    systemProperty 'darkmusic.test.pipReleaseJar', providers.gradleProperty('pipRuntimeReleaseJar').isPresent() ? file(providers.gradleProperty('pipRuntimeReleaseJar').get()).absolutePath : ''
    systemProperty 'darkmusic.test.managedTools', providers.gradleProperty('managedToolsIntegration').isPresent()
    systemProperty 'darkmusic.test.managedData', file('build/managed-tools-integration').absolutePath
    systemProperty 'darkmusic.test.music', realMusicDirectory
    systemProperty 'darkmusic.test.requireMusic', providers.gradleProperty('requireMusic').isPresent()
    testLogging { events 'failed', 'skipped' }
    systemProperty 'darkmusic.jar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    if (providers.gradleProperty('downloadIntegration').isPresent()) {
        def executableSuffix = System.getProperty('os.name').startsWith('Windows') ? '.exe' : ''
        systemProperty 'darkmusic.test.ytdlp', new File(downloadToolsDirectory, "yt-dlp${executableSuffix}").absolutePath
        systemProperty 'darkmusic.test.ffmpeg', new File(downloadToolsDirectory, "ffmpeg${executableSuffix}").absolutePath
        systemProperty 'darkmusic.test.ffprobe', new File(downloadToolsDirectory, "ffprobe${executableSuffix}").absolutePath
    }
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

// Java feature integration stays in the mod; all native code/runtime files are opt-in.
// Opt out explicitly for Java-only work on machines without the .NET SDK.
if (!providers.gradleProperty('javaOnly').isPresent()) apply from: 'gradle/native-helpers.gradle'

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    if (providers.gradleProperty('javaOnly').isPresent()) exclude 'assets/darkmusic/pip/**', 'assets/darkmusic/media/**'
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}

tasks.named('sourcesJar', Jar) {
    exclude 'assets/darkmusic/pip/**', 'assets/darkmusic/media/**'
    from('src/pipHelper') {
        include '*.cs', '*.csproj', 'global.json', 'packages.lock.json', 'licenses/**';
        into 'pip-helper'
    }
    from('src/mediaHelper') {
        include '*.cs', '*.csproj', 'global.json', 'packages.lock.json', 'licenses/**'
        into 'media-helper'
    }
    def projectName = project.name
    inputs.property "projectName", projectName
    from('LICENSE') { rename { "${it}_$projectName" } }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

// Keep distributed notices current without modifying the original licensed source notice.
def distributionVersion = project.version.toString()
tasks.withType(AbstractCopyTask).configureEach {
    filesMatching(['THIRD-PARTY-NOTICES.md', '**/THIRD-PARTY-NOTICES.md']) {
        filter { line -> line.replace('@DARKMUSIC_VERSION@', distributionVersion).replaceAll(/darkmusic-[0-9]+(?:\.[0-9]+)*-third-party-sources\.zip/, "darkmusic-${distributionVersion}-third-party-sources.zip") }
    }
}
