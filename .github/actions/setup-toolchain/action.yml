name: Set up the build toolchain
description: >-
  Validates the Gradle wrapper and installs JDK 25 and the .NET SDK pinned in src/pipHelper/global.json, which both
  optional Windows helpers build with. Used by the build and release workflows so they cannot drift apart.
runs:
  using: composite
  steps:
    - name: validate gradle wrapper
      uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
    - name: setup jdk
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '25'
        # Avoid the Microsoft manifest lookup that failed on Windows and macOS runners.
        distribution: 'temurin'
    - name: setup .NET SDK for the optional Windows helpers
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/pipHelper/global.json
    - name: make gradle wrapper executable
      if: runner.os != 'Windows'
      shell: bash
      run: chmod +x ./gradlew
