# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  pull_request:
  push:
    branches: ['main']

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup toolchain
        uses: ./.github/actions/setup-toolchain
      - name: build
        # PiP is Windows-only at runtime; the helper cross-publishes on all builders.
        if: runner.os != 'Windows'
        run: ./gradlew build -PbundlePipHelper
        # Private music is never uploaded to hosted runners. Audio-dependent
        # checks explicitly skip when absent; release validation runs locally
        # with -PrequireMusic -PdownloadIntegration and the real collection.
      - name: build on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat build -PbundlePipHelper
