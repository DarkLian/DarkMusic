name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release commit is on main
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Verify version tag
        # SDK builds the helper; mod users receive its self-contained runtime.
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          test -n "$version"
          test "$RELEASE_TAG" = "v$version"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.421'
      - name: Build and test
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew build -PbundlePipHelper
      - name: Build and test on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat build -PbundlePipHelper
        # Private-audio checks explicitly skip on hosted runners. Full local
        # release validation requires the real collection with -PrequireMusic.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: release-files
          path: build/libs/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-files
          path: release-files
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for file in "darkmusic-$version.jar" "darkmusic-$version-sources.jar" "darkmusic-$version-third-party-sources.zip" "darkmusic-pip-dependencies-$version-windows-x64.zip"; do
            test -s "release-files/$file"
          done
          notes="docs/releases/RELEASE-$version.md"
          test -s "$notes"
          cp "$notes" release-files/release-notes.md
          python3 - "$version" <<'PY'
          import sys, hashlib
          from pathlib import Path
          folder = Path('release-files')
          version = sys.argv[1]
          deps = folder / f'darkmusic-pip-dependencies-{version}-windows-x64.zip'
          with (folder / 'release-notes.md').open('a') as notes:
              notes.write(f'\n\nPiP native package (helper and runtime) SHA-256: `{hashlib.sha256(deps.read_bytes()).hexdigest()}`\n')
          PY
          gh release create "$RELEASE_TAG" --verify-tag --latest --title "DarkMusic $RELEASE_TAG" --notes-file release-files/release-notes.md \
            "release-files/darkmusic-$version.jar" \
            "release-files/darkmusic-$version-sources.jar" \
            "release-files/darkmusic-$version-third-party-sources.zip" \
            "release-files/darkmusic-pip-dependencies-$version-windows-x64.zip"
